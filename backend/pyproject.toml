[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "konta-backend"
version = "0.1.0"
description = "Backend de Konta: finanzas personales multi-usuario y multi-moneda"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.40,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2,<3.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "apscheduler>=3.10",
    "pypdf>=4.0",
    "python-multipart>=0.0.9",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
