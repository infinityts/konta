server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy de la API: /api/auth/login -> http://backend:8000/auth/login
    location /api/ {
        # El backend se **recrea** en cada despliegue y cambia de IP. Sin `resolver`, nginx
        # resuelve `backend` una sola vez al arrancar y se queda con la IP vieja: el sitio
        # carga (es estático) pero **toda la API responde 502** y parece que el servicio
        # está caído. Con esto se vuelve a resolver cada 10 segundos.
        resolver 10.89.3.1 valid=10s ipv6=off;
        set $backend_upstream backend;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend_upstream:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # El manifiesto de la PWA necesita su tipo MIME: nginx no conoce `.webmanifest` y lo
    # servía como `application/octet-stream` (los navegadores lo aceptan, pero es incorrecto).
    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    # Los assets llevan el hash en el nombre: se pueden cachear para siempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El index **no** se cachea: sin esto, después de desplegar el navegador sigue usando
    # el bundle viejo (y parece que el despliegue no llegó).
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
