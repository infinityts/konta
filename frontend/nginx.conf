server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy de la API: /api/auth/login -> http://backend:8000/auth/login
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Los assets llevan el hash en el nombre: se pueden cachear para siempre
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El index **no** se cachea: sin esto, después de desplegar el navegador sigue usando
    # el bundle viejo (y parece que el despliegue no llegó).
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
