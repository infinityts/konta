name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + pytest + alembic check)
    runs-on: ubuntu-latest

    services:
      db:
        # PostgreSQL 16 oficial: Konta no usa pgvector (solo pgcrypto, que viene
        # en la imagen oficial). Es la misma imagen que docker-compose.yml.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: finanzas
          POSTGRES_PASSWORD: finanzas
          POSTGRES_DB: finanzas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U finanzas -d finanzas"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      FINANZAS_DATABASE_URL: postgresql+psycopg://finanzas:finanzas@localhost:5432/finanzas
      FINANZAS_TEST_DATABASE_URL: postgresql+psycopg://finanzas:finanzas@localhost:5432/finanzas
      FINANZAS_SECRET_KEY: secreto-solo-para-ci

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Primero el linter: es lo más rápido y lo que mejor explica un fallo.
      # La config vive en pyproject.toml ([tool.ruff]), con B008 (Depends en los
      # valores por defecto) y FURB157 (Decimal("0.00")) ignorados a propósito.
      - name: Linter (ruff)
        run: ruff check .

      - name: Migraciones (Alembic)
        run: alembic upgrade head

      # El esquema solo evoluciona por migraciones: si los modelos y las
      # migraciones se separan, esto falla (paso antes de la migracion 0017).
      - name: Comprobar que no hay deriva de esquema
        run: alembic check

      - name: Publicar el motivo si fallan los tests
        if: failure()
        run: |
          echo "### Fallaron los tests" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E "^(FAILED|ERROR)|^E  |assert" /tmp/pytest.log | tail -40 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -30 /tmp/pytest.log >> $GITHUB_STEP_SUMMARY

      - name: Tests
        # La salida se guarda además en un archivo: si falla, el paso siguiente publica el motivo
        # en el resumen del trabajo. Un CI que dice «falló» y no dice qué falla obliga a adivinar.
        run: pytest -q 2>&1 | tee /tmp/pytest.log

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # `pnpm build` = tsc --noEmit && vite build
      - name: Typecheck y build
        run: pnpm build
