services:
  db:
    # PostgreSQL 16 oficial: Konta no usa pgvector (solo pgcrypto, incluido en la
    # imagen oficial). Coincide con docs/despliegue.md.
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finanzas
      POSTGRES_PASSWORD: finanzas
      POSTGRES_DB: finanzas
    ports:
      - "5433:5432"
    volumes:
      - finanzas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finanzas -d finanzas"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      FINANZAS_DATABASE_URL: postgresql+psycopg://finanzas:finanzas@db:5432/finanzas
      FINANZAS_SECRET_KEY: cambiar-por-un-secreto-largo-y-aleatorio
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    # /health comprueba **también la base**: si PostgreSQL se cae, el contenedor
    # pasa a unhealthy en vez de mentir con un 200. Se usa python (ya está en la
    # imagen) para no depender de curl.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)
      interval: 10s
      timeout: 5s
      retries: 5
      # margen para las migraciones del arranque (alembic upgrade head)
      start_period: 30s

  frontend:
    build: ./frontend
    depends_on:
      backend:
        # Que no sirva la web hasta que el backend (y su base) estén listos: antes
        # arrancaba en cuanto el contenedor existía, aunque las migraciones siguieran
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  finanzas_pgdata:
