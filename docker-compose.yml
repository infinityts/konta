services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: finanzas
      POSTGRES_PASSWORD: finanzas
      POSTGRES_DB: finanzas
    ports:
      - "5433:5432"
    volumes:
      - finanzas_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finanzas -d finanzas"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      FINANZAS_DATABASE_URL: postgresql+psycopg://finanzas:finanzas@db:5432/finanzas
      FINANZAS_SECRET_KEY: cambiar-por-un-secreto-largo-y-aleatorio
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  finanzas_pgdata:
